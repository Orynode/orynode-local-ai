version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 过渡期：@xenova/transformers 由 Milestone #1 统一迁移，勿单独 bump
      - dependency-name: "@xenova/transformers"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
