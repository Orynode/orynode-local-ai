name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run test:retrieval-eval
      - run: npm run test:smoke-runtime
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
      - name: Upload retrieval eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: .orynode/eval/
          if-no-files-found: ignore

  smoke-omit-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run test:smoke-runtime
      - name: Verify tsx resolves without devDependencies
        run: node -e "require.resolve('tsx/esm/api')"
